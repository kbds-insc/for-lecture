<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S3 Static Website Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
      color: #0f172a;
    }

    .card {
      width: min(92vw, 680px);
      padding: 48px 40px;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.1;
    }

    p {
      margin: 0;
      font-size: 18px;
      line-height: 1.7;
      color: #475569;
    }

    .meta {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
      font-size: 14px;
      color: #64748b;
    }

    code {
      padding: 3px 6px;
      border-radius: 6px;
      background: #f1f5f9;
      color: #334155;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">AWS S3 Static Website</div>
    <h1>배포 테스트 성공</h1>
    <p>
      이 페이지가 보인다면 <code>index.html</code> 파일이 S3 정적 웹사이트 호스팅 또는 CloudFront를 통해 정상 배포된 상태입니다.
    </p>
    <div class="meta">
      Generated for static website deployment test
    </div>
  </main>
</body>
</html>
