name: Deploy to S3 and CloudFront

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::303002801225:role/GitHubActionDeployRole
          aws-region: ap-northeast-2

      - name: Upload to S3
        run: |
          aws s3 sync . s3://cis-web-deploy-test/ --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1KGDZ1PKN4ZG8 \
            --paths "/*"